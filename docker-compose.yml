version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hackathon:${DB_PASSWORD}@postgres:5432/hackathon
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      SCHEDULER_URL: http://scheduler:8001
      # Sites allowed to call this API with credentials. Unset, the API falls
      # back to reflecting any origin and warns on boot.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Salt for judge portal links. Changing this invalidates every link
      # already sent, so set it before an event and never during one.
      JUDGE_TOKEN_SALT: ${JUDGE_TOKEN_SALT}
      AWS_REGION: ap-southeast-1
  scheduler:
    build:
      context: ./apps/scheduler
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  pgdata:
